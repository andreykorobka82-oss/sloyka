<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница с выбором</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .options {
            margin-top: 20px;
            text-align: left;
        }
        .option {
            margin-bottom: 10px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Сделайте свой выбор</h1>
        <p>Какой ваш любимый цвет?</p>
        
        <div class="options">
            <div class="option">
                <input type="radio" id="colorRed" name="color" value="Красный">
                <label for="colorRed">Красный</label>
            </div>
            <div class="option">
                <input type="radio" id="colorGreen" name="color" value="Зеленый">
                <label for="colorGreen">Зеленый</label>
            </div>
            <div class="option">
                <input type="radio" id="colorBlue" name="color" value="Синий">
                <label for="colorBlue">Синий</label>
            </div>
        </div>
        
        <button onclick="alert('Спасибо за ваш выбор!')">Отправить</button>
    </div>

</body>
</html>
